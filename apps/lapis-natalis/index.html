<style>
/* Layout: a maison's private salon. Centered wordmark between hairlines, the date and stone as a quiet selector, the stone on a velvet tray beside its light, notes set like a catalogue. Single dark world by design. */
:root{
  color-scheme:dark;
  --bg:#0A0908; --surface:#12110F; --velvet:#060505; --ink:#ECE6DA; --muted:#8C8478; --line:#2A2620; --gold:#B9A27C; --gold-dim:#6E6150;
  --gem:#8a5bb8;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-jp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-label:"Jost","Futura","Avenir Next",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg) radial-gradient(ellipse 90% 60% at 50% 0%,#17140F 0%,var(--bg) 70%) no-repeat;color:var(--ink);font-family:var(--f-body);font-weight:300;font-size:15px;line-height:1.8;letter-spacing:.02em}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px;display:flex;flex-direction:column;gap:44px}
.eyebrow,.lbl,.dayno,.stone-en,.scale-mark,.hint,.status,.lang .chip{font-family:var(--f-label);font-weight:300;letter-spacing:.24em;text-transform:uppercase}
.eyebrow{font-size:10.5px;color:var(--gold)}

.mast{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.topline{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mark{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;width:100%;margin-top:14px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim))}
.rule:last-child{background:linear-gradient(90deg,var(--gold-dim),transparent)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,50px);line-height:1;margin:0;letter-spacing:.08em;font-optical-sizing:auto}
h1 i{font-style:italic;color:var(--gold)}
.kana{margin:0;font-family:var(--f-jp);font-size:11.5px;letter-spacing:.5em;color:var(--muted);padding-left:.5em}
.lead{margin:4px 0 0;color:var(--muted);max-width:52ch;font-size:12.5px;line-height:1.9}
h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.04em;text-wrap:balance}
:lang(ja) h2{font-family:var(--f-jp);font-weight:500;font-size:21px;letter-spacing:.12em}

.lang{gap:0}
.lang .chip{font-size:10.5px;border:0;padding:4px 10px;color:var(--muted)}
.lang .chip[aria-pressed="true"]{background:transparent;color:var(--gold);box-shadow:inset 0 -1px 0 var(--gold)}

.pick{display:grid;grid-template-columns:auto 1fr;gap:20px 48px;align-items:end;padding-block:22px;border-block:1px solid var(--line)}
@media (max-width:720px){.pick{grid-template-columns:1fr}}
.birth{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:36px 48px;padding:36px clamp(18px,3.5vw,44px);border:1px solid var(--gold-dim);background:linear-gradient(160deg,#17140F 0%,#0C0B09 62%);box-shadow:inset 0 0 0 5px var(--bg),inset 0 0 0 6px var(--line)}
@media (max-width:880px){.birth{grid-template-columns:1fr}}
.birth-card{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;min-width:0}
.bigdate{display:flex;align-items:center;gap:clamp(10px,2vw,22px)}
.bd-main{display:flex;flex-direction:column;align-items:center;min-width:3ch}
.bd-day{font-family:var(--f-display);font-style:italic;font-size:clamp(96px,13vw,164px);line-height:.95;color:var(--gold);font-variant-numeric:lining-nums}
.bd-month{font-family:var(--f-label);font-weight:300;font-size:12.5px;letter-spacing:.38em;text-transform:uppercase;color:var(--ink);padding-left:.38em;margin-top:6px;white-space:nowrap}
.step{width:46px;height:46px;flex:none;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--gold);font-family:var(--f-display);font-size:24px;line-height:1;cursor:pointer;transition:border-color .25s}
.step:hover{border-color:var(--gold)}
.step:focus-visible,.mbtn:focus-visible,.dbtn:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.bd-stone{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:20px;letter-spacing:.06em}

.bd-stone .dot{width:11px;height:11px}
.today-tag{font-family:var(--f-label);font-weight:400;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#0A0908;background:var(--gold);padding:3px 10px 3px 13px}
.today-btn{font-size:12px;padding:5px 12px}
.birth-pick{display:flex;flex-direction:column;gap:22px;min-width:0}
.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}

.mbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px 10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;min-width:0;transition:border-color .25s,background .25s}
.mbtn:hover{border-color:var(--gold-dim)}
.mbtn .mn{font-family:var(--f-display);font-size:23px;line-height:1;font-variant-numeric:lining-nums}
.mbtn .ms{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbtn .ms .dot{width:7px;height:7px;flex:none}
.mbtn[aria-pressed="true"]{border-color:var(--gold);background:rgba(185,162,124,.08)}
.mbtn[aria-pressed="true"] .mn{color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:4px}
.dbtn{aspect-ratio:1/1;max-width:100%;font-family:var(--f-display);font-size:17px;font-variant-numeric:lining-nums;border:1px solid transparent;background:transparent;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.dbtn:hover{border-color:var(--line)}
.dbtn[aria-pressed="true"]{background:var(--gold);color:#0A0908;border-color:var(--gold)}
.wpopts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.lbl{font-size:10.5px;color:var(--gold)}
.dates{display:flex;gap:14px;align-items:center}
select{font-family:var(--f-display);font-size:20px;padding:4px 26px 6px 2px;border:0;border-bottom:1px solid var(--gold-dim);border-radius:0;background:transparent;color:var(--ink);appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-size:13.5px;letter-spacing:.06em;padding:8px 16px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:10px;transition:border-color .25s,color .25s}
.chip:hover{border-color:var(--gold-dim)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(185,162,124,.06)}
.chip:focus-visible,select:focus-visible,input:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 10px currentColor}
.dayno{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:44px}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.stone-name{font-family:var(--f-display);font-size:34px;font-weight:400;line-height:1.15;letter-spacing:.03em}
:lang(ja) .stone-name{font-family:var(--f-jp);font-weight:500;font-size:30px;letter-spacing:.1em}
.stone-en{font-size:10.5px;color:var(--gold);margin-top:4px}
.tray{position:relative;aspect-ratio:1/1;max-width:100%;background:radial-gradient(circle at 50% 44%,#1C1915 0%,#0D0C0A 46%,var(--velvet) 80%);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab;box-shadow:inset 0 0 0 6px var(--bg),inset 0 0 0 7px var(--line)}
.tray:active{cursor:grabbing}
.tray:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.tray .angle{position:absolute;left:20px;top:16px;font-family:var(--f-label);font-weight:300;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-variant-numeric:tabular-nums;pointer-events:none}
.angle-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.angle-row .chip{font-size:12.5px;padding:6px 12px}
.tray canvas{width:100%;height:100%;display:block}
.tray .hint{position:absolute;left:20px;bottom:16px;font-size:9.5px;color:var(--muted)}
.scale-mark{position:absolute;right:20px;bottom:16px;font-size:9.5px;color:var(--gold)}
dl.specs{display:grid;grid-template-columns:auto 1fr;gap:0 24px;margin:0;font-size:13.5px}
dl.specs dt,dl.specs dd{padding:9px 0;border-bottom:1px solid var(--line)}
dl.specs dt{color:var(--muted)}
dl.specs dd{margin:0;font-family:var(--f-display);font-size:15px;font-variant-numeric:lining-nums tabular-nums;text-align:right}
.mapnote{font-size:13px;color:var(--muted);margin:0;font-family:var(--f-jp);line-height:1.9}

.stage{border:1px solid var(--line);overflow:hidden;background:var(--velvet);padding:6px}
.stage canvas{display:block;width:100%;height:auto}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px 30px}
.range{display:flex;align-items:center;gap:14px}
.range input{flex:1;min-width:0;accent-color:var(--gold)}
.range output{font-family:var(--f-display);font-size:16px;min-width:3em;text-align:right;font-variant-numeric:lining-nums tabular-nums}
.check{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer;align-self:end}
.check input{accent-color:var(--gold);width:15px;height:15px}
.tile{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:start;padding-block:22px;border-block:1px solid var(--line)}
@media (max-width:480px){.tile{grid-template-columns:1fr}}
.tile img{width:150px;max-height:330px;object-fit:contain;height:auto;display:block;background:var(--velvet);outline:1px solid var(--gold-dim);outline-offset:4px}
.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile strong{color:var(--ink);font-weight:400;font-family:var(--f-display);font-size:18px;letter-spacing:.04em}
:lang(ja) .tile strong{font-family:var(--f-jp);font-size:16px;letter-spacing:.1em}
.export{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.export .chip{font-size:12.5px;padding:6px 12px}
.expsize{font-family:var(--f-display);font-size:14px;color:var(--ink)!important;font-variant-numeric:lining-nums tabular-nums}
.savebtn{align-self:flex-start;font-family:var(--f-label);font-weight:400;font-size:11.5px;letter-spacing:.28em;text-transform:uppercase;padding:14px 30px;border:1px solid var(--gold);background:var(--gold);color:#0A0908;cursor:pointer;transition:background .25s,color .25s}
.savebtn:hover{background:transparent;color:var(--gold)}
.savebtn:disabled{opacity:.5;cursor:progress}
.savebtn:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.status{font-size:9.5px;color:var(--gold-dim);min-height:1.6em;margin-top:6px!important}

.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:30px;padding:0;margin:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;padding-top:18px;border-top:1px solid var(--line)}
.how li::before{content:counter(s,upper-roman);font-family:var(--f-display);font-style:italic;font-size:30px;color:var(--gold);display:block;line-height:1}
.how h3{font-family:var(--f-jp);font-weight:500;font-size:15.5px;letter-spacing:.08em;margin:12px 0 6px}
.how p{margin:0;font-size:13.5px;color:var(--muted)}
.lore{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:44px;padding-block:40px;border-block:1px solid var(--line);background:linear-gradient(180deg,transparent,rgba(185,162,124,.035),transparent)}
@media (max-width:880px){.lore{grid-template-columns:1fr;gap:28px}}
.lore-words{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.lore-stone{font-size:30px}
.words{margin:6px 0 0;font-family:var(--f-display);font-style:italic;font-size:clamp(22px,2.6vw,30px);line-height:1.5;color:var(--gold);display:flex;flex-direction:column}
:lang(ja) .words{font-family:var(--f-jp);font-style:normal;font-weight:500;letter-spacing:.3em}
.words span{display:block}
.lore-text{margin:0;display:flex;flex-direction:column;gap:22px}
.lore-text div{display:grid;grid-template-columns:7.5em 1fr;gap:18px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.lore-text div:last-child{border-bottom:0;padding-bottom:0}
@media (max-width:480px){.lore-text div{grid-template-columns:1fr;gap:6px}}
.lore-text dt{font-family:var(--f-label);font-weight:300;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);padding-top:4px}
.lore-text dd{margin:0;font-size:14.5px;line-height:1.95;color:var(--ink);max-width:62ch;font-family:var(--f-jp)}
:lang(en) .lore-text dd{font-family:var(--f-body)}
.lore-text dd::first-letter{font-family:var(--f-display)}
footer{font-size:12px;color:var(--muted);max-width:72ch;margin:0 auto;text-align:center;padding-top:28px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div class="wrap">
  <header class="mast">
    <div class="topline"><span class="eyebrow">Pietre natali · Prototipo</span>
      <div class="chips lang" id="langs" role="group" aria-label="Language">
        <button class="chip" type="button" data-v="en" aria-pressed="true">English</button>
        <button class="chip" type="button" data-v="ja" aria-pressed="false">日本語</button>
      </div></div>
    <div class="mark"><span class="rule"></span><h1 data-i="title"></h1><span class="rule"></span></div>
    <p class="kana" data-i="kana"></p>
    <p class="lead" data-i="lead"></p>
  </header>

  <section class="birth" data-a="pickAria">
    <div class="birth-card">
      <span class="lbl" data-i="birthday"></span>
      <div class="bigdate">
        <button class="step" id="prevDay" type="button" data-a="prevDay">‹</button>
        <div class="bd-main"><span class="bd-day" id="bdDay"></span><span class="bd-month" id="bdMonth"></span></div>
        <button class="step" id="nextDay" type="button" data-a="nextDay">›</button>
      </div>
      <span class="dayno" id="dayno"></span>
      <span class="today-tag" id="todayTag" data-i="todayTag"></span>
      <button class="chip today-btn" id="goToday" type="button" data-i="goToday" hidden></button>
      <div class="bd-stone"><span class="dot" id="bdDot"></span><span id="bdStone"></span></div>
    </div>
    <div class="birth-pick">
      <div class="field"><span class="lbl" data-i="monthLbl"></span><div class="months" id="months" role="group" data-a="monthLbl"></div></div>
      <div class="field"><span class="lbl" data-i="dayLbl"></span><div class="days" id="days" role="group" data-a="dayLbl"></div></div>
      <div class="field" id="stoneField"><span class="lbl" data-i="stonesLbl"></span><div class="chips" id="stones" role="group" data-a="stonesLbl"></div></div>
    </div>
  </section>

  <div class="grid">
    <section class="col" data-a="gemAria">
      <div class="head">
        <div><div class="stone-name" id="sname"></div><div class="stone-en" id="sen"></div></div>

      <div class="angle-row">
        <div class="chips" id="links" role="group" data-a="linkLbl">
          <button class="chip" type="button" data-v="on" aria-pressed="true" data-i="linkOn"></button>
          <button class="chip" type="button" data-v="off" aria-pressed="false" data-i="linkOff"></button>
        </div>
        <button class="chip" type="button" id="resetAng" data-i="resetAng"></button>
      </div>
      <dl class="specs" id="specs"></dl>
      <p class="mapnote" id="mapnote"></p>
    </section>

    <section class="col" data-a="patAria">
      <div class="head"><h2 data-i="pattern"></h2><span class="dayno" id="tileinfo"></span></div>
      <div class="stage"><canvas id="preview" width="800" height="640" data-a="previewAria"></canvas></div>

            <button class="chip" type="button" data-v="sumi" aria-pressed="true"><span class="dot" style="background:#14161c"></span><span data-i="sumi"></span></button>
            <button class="chip" type="button" data-v="paper" aria-pressed="false"><span class="dot" style="background:#f2f1ec"></span><span data-i="paper"></span></button>
          </div></div>
        <div class="field"><span class="lbl" data-i="strengthLbl"></span>

              <button class="chip" type="button" data-v="desktop" aria-pressed="false" data-i="expDesktop"></button>

            <div class="wpopts" id="wpOpts" hidden>
              <span class="lbl" data-i="wpTextLbl"></span>
              <div class="chips" id="wptext" role="group" data-a="wpTextLbl">

                <button class="chip" type="button" data-v="words" aria-pressed="false" data-i="wpWords"></button>
                <button class="chip" type="button" data-v="full" aria-pressed="true" data-i="wpFull"></button>
              </div>
              <span class="lbl" data-i="wpPosLbl"></span>
              <div class="chips" id="wppos" role="group" data-a="wpPosLbl">
                <button class="chip" type="button" data-v="bottom" aria-pressed="true" data-i="wpBottom"></button>
                <button class="chip" type="button" data-v="center" aria-pressed="false" data-i="wpCenter"></button>
              </div>
            </div>
            <button class="savebtn" type="button" id="saveBtn" data-i="saveBtn" hidden></button>

    <dl class="lore-text">

      <div><dt data-i="natureLbl"></dt><dd id="lNature"></dd></div>
      <div><dt data-i="legendLbl"></dt><dd id="lLegend"></dd></div>

      <li><h3 data-i="h4t"></h3><p data-i="h4p"></p></li>

  </section>

  <footer data-i="foot"></footer>
</div>

const LORE={"garnet": {"ja": {"words": ["真実", "友愛", "忠実"], "origin": "ラテン語の granatum（ザクロ）に由来します。粒の結晶が密に集まる姿がザクロの実に似ていることからの名で、和名も柘榴石（ざくろいし）です。", "nature": "ガーネットは一つの鉱物ではなく、よく似た結晶構造をもつケイ酸塩鉱物のグループです。モース硬度は7から7.5で、青を除くほとんどの色が知られています。", "legend": "旧約の伝承では、ノアが暗い夜に箱舟を照らすために赤い石を吊るしたと語られ、それがガーネットだったとされています。旅の守り石としても大切にされてきました。"}, "en": {"words": ["Truth", "Friendship", "Constancy"], "origin": "From the Latin granatum, pomegranate. Clusters of small crystals resemble the fruit's seeds, and the Japanese name zakuro-ishi means the same.", "nature": "Garnet is not one mineral but a group of silicates sharing a similar crystal structure. Its Mohs hardness is 7 to 7.5, and it occurs in nearly every color except blue.", "legend": "An old tradition says Noah hung a glowing red stone to light the ark through dark nights, and that stone is said to have been a garnet. It has long been carried as a traveler's talisman."}}, "amethyst": {"ja": {"words": ["誠実", "心の平和"], "origin": "ギリシア語の amethystos（酔わない）に由来します。古代ギリシアの人々は、この石を身につけたり杯にしたりすると酒に酔わないと信じていました。和名は紫水晶です。", "nature": "石英の仲間で、紫色は結晶中の微量の鉄と、天然の放射線の作用によるものです。加熱すると黄色に変わり、市場に出るシトリンの多くはこうして生まれます。", "legend": "ルネサンス期フランスの詩人ベローの詩では、酒神バッカスに追われた乙女アメシストが月の女神に白い石に変えられ、悔いたバッカスが注いだ葡萄酒で紫に染まったと歌われています。"}, "en": {"words": ["Sincerity", "Peace of mind"], "origin": "From the Greek amethystos, not drunk. Ancient Greeks believed that wearing the stone, or drinking from a cup carved of it, kept one sober.", "nature": "A variety of quartz. Its purple comes from trace iron acted on by natural radiation. Heated, it turns yellow, which is how most citrine on the market is made.", "legend": "In a poem by the Renaissance French poet Rémy Belleau, the maiden Amethyst, pursued by Bacchus, is turned to white stone by Diana; the remorseful god pours wine over her and stains her purple."}}, "aquamarine": {"ja": {"words": ["沈着", "勇敢", "聡明"], "origin": "ラテン語の aqua marina（海の水）に由来します。澄んだ海の色そのものが名前になりました。", "nature": "エメラルドと同じベリルの仲間で、青色は微量の鉄によるものです。モース硬度は7.5から8。大きく透明な結晶に育ちやすく、内包物の少ない石が多いのが特徴です。", "legend": "船乗りたちは航海の無事を願ってこの石を身につけ、人魚の宝が浜に流れ着いたものだとも語られました。荒れた海を鎮める力があると信じられていました。"}, "en": {"words": ["Composure", "Courage", "Clarity of mind"], "origin": "From the Latin aqua marina, water of the sea. The name is simply the color of clear seawater.", "nature": "A beryl, like emerald, colored blue by trace iron. Mohs hardness 7.5 to 8. It grows readily into large transparent crystals, often with very few inclusions.", "legend": "Sailors wore it for safe passage, and some said it was mermaid treasure washed ashore. It was believed to calm rough seas."}}, "diamond": {"ja": {"words": ["永遠の絆", "純潔", "不屈"], "origin": "ギリシア語の adamas（征服されないもの）に由来します。何ものにも傷つけられない硬さを表した言葉で、和名は金剛石です。", "nature": "炭素だけでできた結晶で、天然の物質の中で最も硬いモース硬度10。屈折率と分散が大きいため、ブリリアンカットで光を虹色にきらめかせます。", "legend": "古代ギリシアでは神々の涙、あるいは星のかけらだと考えられていました。1477年、オーストリア大公マクシミリアンがブルゴーニュのマリーに贈った指輪が、ダイヤモンドの婚約指輪の始まりとして知られています。"}, "en": {"words": ["Eternal bond", "Purity", "Invincibility"], "origin": "From the Greek adamas, the unconquerable, a word for a hardness nothing could scratch.", "nature": "A crystal of pure carbon and the hardest natural substance, Mohs 10. Its high refractive index and dispersion let a brilliant cut break light into rainbow fire.", "legend": "Ancient Greeks thought diamonds were tears of the gods or splinters of fallen stars. The ring Archduke Maximilian gave Mary of Burgundy in 1477 is often cited as the first diamond engagement ring."}}, "emerald": {"ja": {"words": ["幸運", "幸福", "夫婦愛"], "origin": "ギリシア語の smaragdos（緑の石）がラテン語、古フランス語を経て変化した名です。和名は翠玉（すいぎょく）。", "nature": "ベリルの仲間で、深い緑はクロムやバナジウムによるものです。ほとんどの石に内包物があり、その様子はフランス語で jardin（庭）と呼ばれ、天然の証として愛されています。", "legend": "古代エジプトのクレオパトラはエメラルドをこよなく愛し、紅海近くの鉱山は後に「クレオパトラの鉱山」と呼ばれました。"}, "en": {"words": ["Fortune", "Happiness", "Wedded love"], "origin": "From the Greek smaragdos, green stone, reshaped through Latin and Old French.", "nature": "A beryl colored deep green by chromium or vanadium. Nearly every stone has inclusions, called its jardin, French for garden, and prized as a mark of natural origin.", "legend": "Cleopatra loved emeralds, and the ancient mines near the Red Sea later came to be called Cleopatra's Mines."}}, "jade": {"ja": {"words": ["長寿", "繁栄", "徳"], "origin": "英語の jade はスペイン語の piedra de ijada（脇腹の石）から。腰の痛みに効くと信じられたためです。漢字の翡翠は、もとは鳥のカワセミを指す言葉でした。", "nature": "翡翠（ヒスイ輝石）は細かな結晶が絡み合っていて、硬さ以上に割れにくい強靱な石です。新潟県糸魚川一帯の翡翠は縄文時代から加工され、2016年には日本の国石に選ばれました。", "legend": "古代中国では玉は君子の徳にたとえられ、孔子はその温かな光沢を仁に、澄んだ音を楽にたとえたと伝えられます。日本では勾玉として神宝にも用いられました。"}, "en": {"words": ["Longevity", "Prosperity", "Virtue"], "origin": "From the Spanish piedra de ijada, stone of the flank, believed to ease pains of the side. The Chinese characters for it once named the kingfisher.", "nature": "Jadeite is a mat of interlocking tiny crystals, making it far tougher than its hardness suggests. Jade from Itoigawa in Niigata was worked in Japan since the Jomon period and was named Japan's national stone in 2016.", "legend": "In ancient China jade stood for the virtues of the noble person; Confucius is said to have likened its warm luster to benevolence. In Japan it was shaped into magatama and kept as sacred treasure."}}, "moonstone": {"ja": {"words": ["恋の予感", "純粋な愛", "幸運"], "origin": "表面を青白い光が月明かりのように漂うことから名づけられました。和名は月長石です。", "nature": "長石の仲間で、性質の異なる薄い層が交互に重なっています。その層が光を散乱させ、アデュラレッセンスと呼ばれる浮かぶような光が生まれます。", "legend": "インドでは月の光が固まってできた聖なる石とされ、満月の夜にこの石を口に含むと恋人たちは未来を見ることができると語られました。"}, "en": {"words": ["Hint of love", "Pure love", "Good fortune"], "origin": "Named for the pale blue light that drifts over its surface like moonlight.", "nature": "A feldspar built of alternating thin layers of two slightly different minerals. The layers scatter light into the floating glow called adularescence.", "legend": "In India it was held sacred, formed from solidified moonbeams, and lovers were said to glimpse their future by holding it in their mouths under a full moon."}}, "pearl": {"ja": {"words": ["健康", "長寿", "富", "純潔"], "origin": "英語の pearl は古フランス語の perle を経た言葉で、その先の語源には諸説あります。日本では古く「白玉（しらたま）」と呼ばれ、万葉集にも詠まれています。", "nature": "貝が異物を真珠層で包んでできる有機質の宝石です。真珠層はアラゴナイトの薄板とタンパク質が交互に重なったもので、この重なりが干渉色の照りを生みます。1893年には御木本幸吉が半円真珠の養殖に成功しました。", "legend": "ローマのプリニウスによれば、クレオパトラはアントニウスとの賭けに勝つため、大粒の真珠を酢に溶かして飲み干したといいます。"}, "en": {"words": ["Health", "Longevity", "Wealth", "Purity"], "origin": "From the Old French perle; its earlier origin is debated. In old Japan it was called shiratama, white jewel, and appears in the Man'yoshu poems.", "nature": "An organic gem formed as a mollusk coats an irritant in nacre: thin aragonite platelets layered with protein. The layering creates its interference luster. In 1893 Kokichi Mikimoto first succeeded in culturing pearls.", "legend": "Pliny tells that Cleopatra, to win a wager with Mark Antony, dissolved a great pearl in vinegar and drank it."}}, "ruby": {"ja": {"words": ["情熱", "仁愛", "威厳"], "origin": "ラテン語の ruber（赤）に由来します。和名は紅玉。サンスクリットでは ratnaraj、宝石の王と呼ばれました。", "nature": "サファイアと同じコランダムで、赤はクロムによるものです。クロムは紫外線で赤く蛍光するため、日の光の下で内側から燃えるように見えます。モース硬度9。", "legend": "ビルマの戦士たちは、ルビーを身につけるだけでなく皮膚の下に埋め込むと、戦場で傷を負わなくなると信じていたと伝えられます。"}, "en": {"words": ["Passion", "Benevolence", "Dignity"], "origin": "From the Latin ruber, red. In Sanskrit it was ratnaraj, king of gems.", "nature": "Corundum, like sapphire, colored red by chromium. Chromium also fluoresces red under ultraviolet, so in daylight the stone seems to burn from within. Mohs 9.", "legend": "Burmese warriors were said to set rubies beneath their skin, believing it made them invulnerable in battle."}}, "peridot": {"ja": {"words": ["夫婦の幸福", "和合"], "origin": "フランス語の péridot に由来しますが、その先は諸説あり、アラビア語の faridat（宝石）とする説があります。和名は橄欖石（かんらんせき）で、オリーブの色にちなみます。", "nature": "かんらん石の宝石名で、地球の深いマントルでできた結晶が火山活動で運ばれてきます。パラサイトと呼ばれる隕石の中にも見つかる、宇宙から来ることもある宝石です。", "legend": "古代エジプトでは「太陽の宝石」と呼ばれ、紅海のザバルガド島で採られました。クレオパトラのエメラルドの一部は、実はペリドットだったという説もあります。"}, "en": {"words": ["Marital happiness", "Harmony"], "origin": "From the French péridot; beyond that its origin is debated, and one theory traces it to the Arabic faridat, gem.", "nature": "The gem form of olivine, crystallized deep in the mantle and carried up by volcanoes. It is also found inside pallasite meteorites, so some peridot comes from space.", "legend": "Ancient Egyptians called it the gem of the sun and mined it on Zabargad Island in the Red Sea. Some of Cleopatra's emeralds may in fact have been peridot."}}, "spinel": {"ja": {"words": ["努力", "向上"], "origin": "ラテン語の spina（とげ）に由来するとされます。先のとがった八面体の結晶の姿からの名で、和名も尖晶石（せんしょうせき）です。", "nature": "マグネシウムとアルミニウムの酸化物で、立方晶系の美しい八面体に育ちます。ルビーとよく似た赤を示すため、長くルビーと取り違えられてきました。", "legend": "英国王冠の「黒太子のルビー」は、実は大粒のスピネルです。アジャンクールの戦いでヘンリー5世が兜に着けていたと伝えられます。"}, "en": {"words": ["Effort", "Growth"], "origin": "Thought to come from the Latin spina, thorn, for its sharply pointed octahedral crystals.", "nature": "An oxide of magnesium and aluminium that grows into crisp cubic octahedra. Its red so closely matches ruby that the two were confused for centuries.", "legend": "The Black Prince's Ruby in the British Imperial State Crown is in fact a large spinel, said to have been worn on Henry V's helmet at Agincourt."}}, "sapphire": {"ja": {"words": ["慈愛", "誠実", "徳望"], "origin": "ギリシア語の sappheiros、ラテン語の sapphirus（青）に由来します。和名は青玉です。", "nature": "ルビーと同じコランダムで、赤以外の色のものはすべてサファイアと呼ばれます。青は鉄とチタンの働きによるもの。モース硬度9で、ダイヤモンドに次ぐ硬さです。", "legend": "古代ペルシアでは、大地は巨大なサファイアの上に載っていて、その青い反射が空の色をつくっていると信じられていました。"}, "en": {"words": ["Compassion", "Sincerity", "Virtue"], "origin": "From the Greek sappheiros and Latin sapphirus, blue.", "nature": "Corundum, like ruby; every color but red is called sapphire. Blue comes from iron and titanium together. Mohs 9, second only to diamond.", "legend": "Ancient Persians believed the earth rested on a giant sapphire whose reflection gave the sky its blue."}}, "opal": {"ja": {"words": ["希望", "幸運", "忍耐"], "origin": "サンスクリットの upala（貴石）が、ラテン語の opalus を経て名になったとされます。和名は蛋白石です。", "nature": "結晶をもたない含水シリカで、数パーセントの水を含みます。遊色は直径数百ナノメートルのシリカ球が規則正しく並び、光を回折させることで生まれます。", "legend": "プリニウスによれば、ローマの元老院議員ノニウスはアントニウスに自分のオパールを差し出すより追放を選びました。オーストラリアには、創造主が虹に乗って降り立った足跡がオパールになったという話が伝わります。"}, "en": {"words": ["Hope", "Good fortune", "Patience"], "origin": "Thought to come from the Sanskrit upala, precious stone, by way of the Latin opalus.", "nature": "Non-crystalline hydrated silica holding a few percent water. Its play of color comes from silica spheres a few hundred nanometers across, stacked in order so that they diffract light.", "legend": "Pliny tells of the Roman senator Nonius, who chose exile over surrendering his opal to Mark Antony. An Australian story says opal formed where the creator stepped down to earth on a rainbow."}}, "tourmaline": {"ja": {"words": ["希望", "潔白"], "origin": "シンハラ語の turmali（混ざった石）に由来します。スリランカで色とりどりの石と一緒に採れたことからの名です。", "nature": "温めたり圧力をかけたりすると電気を帯びる性質があり、和名を電気石といいます。宝石の中でも色の幅がとりわけ広く、一つの結晶に二色が現れることもあります。", "legend": "古代エジプトでは、トルマリンは地球の中心から虹を通って地上に昇ってきたため、虹のすべての色を宿したのだと語られました。"}, "en": {"words": ["Hope", "Innocence"], "origin": "From the Sinhalese turmali, mixed stones, as it was found among gems of many colors in Sri Lanka.", "nature": "It becomes electrically charged when heated or pressed, so its Japanese name means electric stone. Few gems show a wider range of color, and a single crystal can hold two.", "legend": "An Egyptian tale says tourmaline climbed from the earth's center along a rainbow and gathered every one of its colors on the way."}}, "topaz": {"ja": {"words": ["誠実", "友情", "希望"], "origin": "紅海の島 Topazios の名に由来すると伝えられます。ただし、この島で採れていた石は実はペリドットだったと考えられています。和名は黄玉です。", "nature": "フッ素を含むアルミニウムのケイ酸塩で、モース硬度8。一方向にきれいに割れる劈開があります。赤みを帯びたオレンジ色のものはインペリアル・トパーズと呼ばれます。", "legend": "古代ギリシアでは力を授け、危機の際には身につけた人の姿を消してくれると信じられました。エジプトでは太陽神ラーの輝きを宿す石とされていました。"}, "en": {"words": ["Sincerity", "Friendship", "Hope"], "origin": "Said to come from Topazios, an island in the Red Sea, though the stone mined there was probably peridot.", "nature": "A fluorine-bearing aluminium silicate, Mohs 8, with one perfect cleavage. Reddish orange stones are called imperial topaz.", "legend": "Ancient Greeks believed it lent strength and could make its wearer invisible in danger. Egyptians linked its glow to the sun god Ra."}}, "citrine": {"ja": {"words": ["繁栄", "幸運"], "origin": "フランス語の citron（レモン）に由来します。和名は黄水晶です。", "nature": "鉄を含む黄色の石英です。天然のものは少なく、市場の多くはアメシストやスモーキークォーツを加熱して色を変えたものです。", "legend": "商いに富をもたらすと信じられ、「商人の石」と呼ばれてきました。レジや財布にしのばせる習わしも伝わります。"}, "en": {"words": ["Prosperity", "Good fortune"], "origin": "From the French citron, lemon.", "nature": "Yellow quartz colored by iron. Natural citrine is scarce; most on the market is amethyst or smoky quartz turned yellow by heat.", "legend": "Long called the merchant's stone, believed to bring wealth to trade, and tucked into tills and purses for luck."}}, "turquoise": {"ja": {"words": ["成功", "繁栄"], "origin": "フランス語で「トルコの石」の意味です。ペルシア産の石がトルコを経てヨーロッパに運ばれたことからの名で、和名もトルコ石です。", "nature": "銅とアルミニウムを含む含水リン酸塩で、不透明です。母岩が網目状に入ったものはマトリックスと呼ばれ、その模様も一つずつ異なります。", "legend": "ナバホやプエブロの人々は空のかけらとしてこの石を尊び、ペルシアやトルコでは馬から落ちるのを防ぐ騎手のお守りとされました。"}, "en": {"words": ["Success", "Prosperity"], "origin": "French for Turkish stone, since Persian stones reached Europe by way of Turkey.", "nature": "An opaque hydrated phosphate of copper and aluminium. Stones laced with host rock, called matrix, each carry their own web of veins.", "legend": "Navajo and Pueblo peoples honored it as a piece of the sky, and in Persia and Turkey it was a rider's charm against falling from the horse."}}, "tanzanite": {"ja": {"words": ["誇り高き人", "冷静"], "origin": "1967年にタンザニアで見つかり、翌年ティファニーが産地の国名にちなんで命名しました。", "nature": "ゾイサイトの青い変種で、見る方向によって青、紫、赤紫の三色が現れる三色性をもちます。採れるのはキリマンジャロ山麓のメレラニ丘陵だけです。", "legend": "発見の物語として、山火事の後に茶色の結晶が鮮やかな青に変わっているのを牧夫が見つけたと語られます。実際に多くの石は加熱で青を引き出しています。"}, "en": {"words": ["Dignity", "Calm"], "origin": "Found in Tanzania in 1967 and named by Tiffany the following year after the country.", "nature": "A blue variety of zoisite and strongly trichroic: blue, violet or burgundy depending on the viewing angle. It comes only from the Merelani Hills near Kilimanjaro.", "legend": "Its discovery story tells of a herder who found brown crystals turned vivid blue after a grass fire. Most stones today are indeed heated to bring out the blue."}}};

let LANG='en';try{const v=localStorage.getItem('lapis-natalis-lang');if(v==='ja'||v==='en')LANG=v;}catch(e){}
const t=k=>I18N[LANG][k];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function hsv(h,s,v){h=((h%1)+1)%1;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);return [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i%6];}
function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l];}

/* ---------- wave orbits for each wallpaper symmetry ---------- */
const r60=v=>[(v[0]-v[1])/2,(3*v[0]+v[1])/2];
function orbitList(kind,ar){
  const ops= kind==='sq'?[v=>[-v[1],v[0]],v=>[v[0],-v[1]]]
    : kind==='hex'?[r60,v=>[v[0],-v[1]]]
    : kind==='tri'?[v=>r60(r60(v)),v=>[v[0],-v[1]]]
    : [v=>[-v[0],v[1]],v=>[v[0],-v[1]]];
  const isHex=kind==='hex'||kind==='tri';
  const len=v=>isHex?Math.hypot(v[0],v[1]/SQ3):kind==='sq'?Math.hypot(v[0],v[1]):Math.hypot(v[0],v[1]/ar);
  const seen=new Set(),out=[];
  for(let m=-8;m<=8;m++)for(let n=-14;n<=14;n++){
    if(!m&&!n)continue; if(isHex&&((m-n)%2))continue;
    const k=m+','+n; if(seen.has(k))continue;
    const orb=[[m,n]],ks=new Set([k]);
    for(let q=0;q<orb.length;q++)for(const op of ops){const w=op(orb[q]),wk=w[0]+','+w[1];if(!ks.has(wk)){ks.add(wk);orb.push(w);}}
    ks.forEach(x=>seen.add(x));
    const L=len([m,n]); if(L<=7.6)out.push({vecs:orb,len:L,hasNeg:orb.some(w=>w[0]===-m&&w[1]===-n)});
  }
  return out.sort((a,b)=>a.len-b.len);
}
function halfSet(vecs){const s=new Set(),o=[];for(const v of vecs){if(s.has((-v[0])+','+(-v[1])))continue;s.add(v[0]+','+v[1]);o.push(v);}return o;}
function pick(list,rng,count){
  const low=list.filter(o=>o.len<=2.7),chosen=[low[Math.floor(rng()*low.length)]];
  const pool=list.filter(o=>o.len>1&&!chosen.includes(o));
  while(chosen.length<count&&pool.length){
    let tot=0;const w=pool.map(o=>{const x=Math.pow(o.len,-.4);tot+=x;return x;});
    let r=rng()*tot,i=0;while(r>w[i]){r-=w[i];i++;}
    chosen.push(pool.splice(Math.min(i,pool.length-1),1)[0]);
  }
  return chosen;
}
const amp=(rng,len)=>(rng()<.5?-1:1)*(.6+.8*rng())*Math.pow(len,-1.35);

function buildTerms(sysInfo,rng){
  const terms=[];let rings=0,RG=0;
  const lat=sysInfo.lat,g=sysInfo.group;
  if(lat==='sq'||lat==='hex'){
    const L=orbitList(lat==='sq'?'sq':'hex');
    const ch=pick(L,rng,3+Math.floor(rng()*3)); rings+=ch.length;
    for(const o of ch){const A=amp(rng,o.len);for(const v of halfSet(o.vecs))terms.push({m:v[0],n:v[1],A,phi:0,ring:RG});RG++;}
    if(g==='p3m1'){
      const T=orbitList('tri').filter(o=>!o.hasNeg&&o.len>1.5);
      const ch2=pick(T,rng,1+Math.floor(rng()*2)); rings+=ch2.length;
      for(const o of ch2){const A=amp(rng,o.len)*1.4;for(const v of o.vecs)terms.push({m:v[0],n:v[1],A,phi:-Math.PI/2,ring:RG});RG++;}
    }
  }else if(g==='pmm'){
    const L=orbitList('rect',sysInfo.ar);
    const ch=pick(L,rng,4+Math.floor(rng()*2)); rings+=ch.length;
    for(const o of ch){const A=amp(rng,o.len);for(const v of halfSet(o.vecs))terms.push({m:v[0],n:v[1],A,phi:0,ring:RG});RG++;}
  }else{
    const cnt=5+Math.floor(rng()*3);
    const used=new Set();
    for(let i=0;i<cnt;i++){
      let m,n,k;do{m=Math.floor(rng()*6)+(i===0?1:0);n=Math.floor(rng()*11)-5;k=m+','+n;}while((!m&&!n)||used.has(k)||(m===0&&n<0));
      used.add(k);
      const len=Math.hypot(m,n/sysInfo.ar);
      terms.push({m,n,A:amp(rng,len)*(i===0?1.6:1),phi:g==='p1'?rng()*TAU:0,ring:RG++});
    }
    rings=cnt;
  }
  return {terms,rings,nR:RG};
}

/* height field and its gradient, separable trig tables */
function field(terms,Rw,Rh,Nw,Nh){
  const T=terms.length,N=Nw*Nh,h=new Float32Array(N),gx=new Float32Array(N),gy=new Float32Array(N);
  const cx=new Float32Array(T*Nw),sx=new Float32Array(T*Nw),cy=new Float32Array(T*Nh),sy=new Float32Array(T*Nh),KX=new Float32Array(T),KY=new Float32Array(T),A=new Float32Array(T);
  for(let t=0;t<T;t++){
    const tm=terms[t],kx=TAU*tm.m/Rw,ky=TAU*tm.n/Rh;KX[t]=kx;KY[t]=ky;A[t]=tm.A;
    for(let i=0;i<Nw;i++){const a=kx*(i+.5)*Rw/Nw+tm.phi;cx[t*Nw+i]=Math.cos(a);sx[t*Nw+i]=Math.sin(a);}
    for(let j=0;j<Nh;j++){const b=ky*(j+.5)*Rh/Nh;cy[t*Nh+j]=Math.cos(b);sy[t*Nh+j]=Math.sin(b);}
  }
  for(let j=0;j<Nh;j++){
    const row=j*Nw;
    for(let t=0;t<T;t++){
      const c=cy[t*Nh+j],s=sy[t*Nh+j],a=A[t],ax=-a*KX[t],ay=-a*KY[t],o=t*Nw;
      for(let i=0;i<Nw;i++){
        const C=cx[o+i],S=sx[o+i],cs=C*c-S*s,sn=S*c+C*s,p=row+i;
        h[p]+=a*cs;gx[p]+=ax*sn;gy[p]+=ay*sn;
      }
    }
  }
  let r=0;for(let p=0;p<N;p++)r+=gx[p]*gx[p]+gy[p]*gy[p];
  return {h,gx,gy,Nw,Nh,rms:Math.sqrt(r/N)};
}

/* light through the surface lands on a periodic floor */
function caustic(F,Rw,Rh,K,factors){
  const {gx,gy,Nw,Nh}=F,w=Rw*Rh/(Nw*Nh),bufs=factors.map(()=>new Float32Array(Rw*Rh));
  const fx0=Rw/Nw,fy0=Rh/Nh;
  for(let j=0;j<Nh;j++){const y=(j+.5)*fy0;
    for(let i=0;i<Nw;i++){const x=(i+.5)*fx0,p=j*Nw+i,dx=-K*gx[p],dy=-K*gy[p];
      for(let c=0;c<factors.length;c++){
        let tx=x+dx*factors[c]-.5,ty=y+dy*factors[c]-.5;
        tx%=Rw;if(tx<0)tx+=Rw;ty%=Rh;if(ty<0)ty+=Rh;
        const x0=tx|0,y0=ty|0,fx=tx-x0,fy=ty-y0,x1=x0+1===Rw?0:x0+1,y1=y0+1===Rh?0:y0+1,b=bufs[c];
        b[y0*Rw+x0]+=w*(1-fx)*(1-fy);b[y0*Rw+x1]+=w*fx*(1-fy);b[y1*Rw+x0]+=w*(1-fx)*fy;b[y1*Rw+x1]+=w*fx*fy;
      }
    }
  }
  return bufs;
}

/* ---------- gem mesh ---------- */
function buildMesh(st,si,rng){
  const V=[],F=[],top=[];
  const critD=Math.asin(1/st.ri)*180/Math.PI;
  const info={critD};
  if(st.cut==='facet'){
    const n=si.n,pav=(40.75+(critD-24.4)*.14),crown=(34.5+(critD-24.4)*.35);
    info.pav=pav;info.crown=crown;
    const rt=.53+rng()*.07,hc=(1-rt)*Math.tan(crown*Math.PI/180),hp=Math.tan(pav*Math.PI/180),g=.03;
    info.table=rt;
    for(let i=0;i<n;i++){const a=TAU*i/n,r=rt*(st.sys==='trigonal'?(i%2?.9:1.08):1);V.push([r*Math.cos(a),hc,r*Math.sin(a)]);}
    for(let j=0;j<2*n;j++){const a=Math.PI*j/n;V.push([Math.cos(a),0,Math.sin(a)]);}
    for(let j=0;j<2*n;j++){const a=Math.PI*j/n;V.push([Math.cos(a),-g,Math.sin(a)]);}
    for(let i=0;i<n;i++){const a=TAU*i/n,r=.44;V.push([r*Math.cos(a),-g-hp*(1-r)*.9,r*Math.sin(a)]);}
    V.push([0,-g-hp,0]);
    const T=i=>((i%n)+n)%n,G=j=>n+((j%(2*n))+2*n)%(2*n),B=j=>3*n+((j%(2*n))+2*n)%(2*n),L=i=>5*n+T(i),C=6*n;
    F.push([...Array(n).keys()]);
    for(let i=0;i<n;i++){
      F.push([T(i),T(i+1),G(2*i+1)],[T(i),G(2*i-1),G(2*i)],[T(i),G(2*i),G(2*i+1)]);
      F.push([B(2*i-1),B(2*i),L(i)],[B(2*i),B(2*i+1),L(i)],[L(i),B(2*i+1),L(i+1)],[L(i),L(i+1),C]);
    }
    for(let j=0;j<2*n;j++)F.push([G(j),G(j+1),B(j+1),B(j)]);
  }else{
    const sphere=st.cut==='sphere',M=36,K=sphere?18:10,hd=st.mat==='moon'?.62:st.mat==='turq'?.46:.52;
    if(sphere){
      for(let k=1;k<K;k++){const p=-Math.PI/2+Math.PI*k/K;for(let i=0;i<M;i++){const a=TAU*i/M;V.push([Math.cos(p)*Math.cos(a),Math.sin(p),Math.cos(p)*Math.sin(a)]);}}
      V.push([0,-1,0],[0,1,0]);const S=V.length-2,N=V.length-1,R=(k,i)=>k*M+((i%M)+M)%M;
      for(let k=0;k<K-2;k++)for(let i=0;i<M;i++)F.push([R(k,i),R(k,i+1),R(k+1,i+1),R(k+1,i)]);
      for(let i=0;i<M;i++){F.push([S,R(0,i+1),R(0,i)]);F.push([N,R(K-2,i),R(K-2,i+1)]);}
    }else{
      for(let k=0;k<K;k++){const p=Math.PI/2*k/K;for(let i=0;i<M;i++){const a=TAU*i/M;V.push([Math.cos(p)*Math.cos(a),Math.sin(p)*hd,Math.cos(p)*Math.sin(a)]);}}
      V.push([0,hd,0]);const A=V.length-1,R=(k,i)=>k*M+((i%M)+M)%M;
      for(let k=0;k<K-1;k++)for(let i=0;i<M;i++)F.push([R(k,i),R(k,i+1),R(k+1,i+1),R(k+1,i)]);
      for(let i=0;i<M;i++)F.push([R(K-1,i),R(K-1,i+1),A]);
      F.push([...Array(M).keys()].reverse());
    }
  }
  for(const v of V)top.push(st.cut==='sphere'?v[1]>=-1e-6:v[1]>=-1e-6);
  if(si.sx){for(const v of V){v[0]*=si.sx;if(si.shear)v[0]+=si.shear*v[2];}}
  let ymin=1e9,ymax=-1e9;for(const v of V){ymin=Math.min(ymin,v[1]);ymax=Math.max(ymax,v[1]);}
  const yc=(ymin+ymax)/2;
  const cen=[0,0,0];for(const v of V){cen[0]+=v[0];cen[1]+=v[1];cen[2]+=v[2];}cen.forEach((c,i)=>cen[i]=c/V.length);
  const normals=[];
  for(let f=0;f<F.length;f++){
    const fc=F[f],a=V[fc[0]],b=V[fc[1]],c=V[fc[2]];
    let n=norm([(b[1]-a[1])*(c[2]-a[2])-(b[2]-a[2])*(c[1]-a[1]),(b[2]-a[2])*(c[0]-a[0])-(b[0]-a[0])*(c[2]-a[2]),(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])]);

const tileCv=document.createElement('canvas'),liveCv=document.createElement('canvas');

function applyAngle(){

const wTerms=()=>C.terms.map(tm=>({...tm,A:tm.A*C.w[tm.ring]}));
function combine(list,w){
  const f0=list[0],N=f0.h.length,h=new Float32Array(N),gx=new Float32Array(N),gy=new Float32Array(N);

  return {h,gx,gy,Nw:f0.Nw,Nh:f0.Nh,rms:Math.sqrt(q/N)||1e-6};
}
function ensureLive(){
  if(C.live)return C.live;
  const lw=240,lh=Math.round(lw*C.Rh/C.Rw),src=[],tgt=[];
  for(let r=0;r<C.nR;r++){const T=C.terms.filter(tm=>tm.ring===r);
    src.push(field(T,lw,lh,Math.round(lw*1.25),Math.round(lh*1.25)));tgt.push(field(T,lw,lh,lw,lh));}

}
function makeTile(cv,Rw,Rh,src,tgt){

  if(S.mode==='facet')overlay(tc,Rw,Rh);

}
function renderLive(){

}
let liveQ=false,fullT=0;

function spaced(ctx,text,cx,y,sp){
  const ch=[...text],ws=ch.map(c=>ctx.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
  let x=cx-tot/2;ctx.textAlign='left';ch.forEach((c,i)=>{ctx.fillText(c,x,y);x+=ws[i]+sp;});return tot;
}
function drawWallText(ctx,W,H){
  if(S.wptext==='none')return;
  const u=Math.min(W,H)/100,ja=LANG==='ja',tx=wpText(),full=S.wptext==='full';
  const gold='#D8C292',ink='#EFE8DA',dim='rgba(216,194,146,.7)';

  else{const g=ctx.createRadialGradient(W/2,cy,0,W/2,cy,Math.max(W,H)*.5);g.addColorStop(0,'rgba(6,5,4,.78)');g.addColorStop(.55,'rgba(6,5,4,.42)');g.addColorStop(1,'rgba(6,5,4,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=u*1.4;

  const wSp=ja?.32:0;

  while(wWidth(wSize)>W*.84&&wSize>u*2)wSize*=.94;
  const rows=[];
  if(full){rows.push({h:2.4*u,draw:y=>{ctx.font=`300 ${2.1*u}px "Jost",sans-serif`;ctx.fillStyle=dim;spaced(ctx,tx.date.toUpperCase(),W/2,y,u*.9);}});rows.push({h:2.6*u});
    rows.push({h:6*u,draw:y=>{ctx.font=ja?`500 ${5*u}px "Shippori Mincho",serif`:`400 ${5.2*u}px "Bodoni Moda",serif`;ctx.fillStyle=ink;spaced(ctx,tx.name,W/2,y,ja?u*1.6:u*1.3);}});rows.push({h:2.4*u});}
  const orn=y=>{ctx.shadowBlur=0;ctx.strokeStyle=gold;ctx.lineWidth=Math.max(1,u*.12);const L=Math.min(W*.2,u*16),d=u*.9;
    ctx.beginPath();ctx.moveTo(W/2-L,y);ctx.lineTo(W/2-d*2,y);ctx.moveTo(W/2+d*2,y);ctx.lineTo(W/2+L,y);ctx.stroke();
    ctx.fillStyle=gold;ctx.beginPath();ctx.moveTo(W/2,y-d);ctx.lineTo(W/2+d,y);ctx.lineTo(W/2,y+d);ctx.lineTo(W/2-d,y);ctx.closePath();ctx.fill();ctx.shadowBlur=u*1.4;};
  rows.push({h:2*u,draw:orn});rows.push({h:(ja?3.2:2.4)*u});
  rows.push({h:wSize*(ja?1.3:1.25),draw:y=>{ctx.font=wFont(wSize);ctx.fillStyle=gold;spaced(ctx,tx.words,W/2,y+(ja?0:wSize*.06),wSize*wSp);}});
  rows.push({h:(ja?3.2:2.6)*u});
  if(full)rows.push({h:3*u,draw:y=>{ctx.font=`italic 400 ${2.6*u}px "Bodoni Moda",serif`;ctx.fillStyle=dim;spaced(ctx,'Lapis Natalis',W/2,y,u*.35);}});

}
function wallpaperFrom(tile,tW,tH,W,H){

function compose(st,F,Lr,Lg,Lb,Rw,Rh){

  const Ld=norm([-.45,-.5,.74]),Hh=norm([Ld[0],Ld[1],Ld[2]+1]),q=.7/rms,ph=C.phase+(C.phShift||0);

      const ang=Math.atan2(gy[p],gx[p])/TAU;

      }else if(st.mat==='moon'){

      }else if(st.mat==='turq'){
        const f=Math.abs(((t*4.2+.12*(Lm-1))%1+1)%1-.5),k=f<.04?1-f/.04:0;
        [r,g,b]=body.map((v,c)=>{const base=255*v*(.55+.45*diff)+40*spec;return base*(1-k*.85)+[92,70,50][c]*k*.85;});
      }else{
        [r,g,b]=body.map(v=>255*v*(.5+.3*s+.25*diff)+50*spec);
      }
    }
    d[o]=clamp(r,0,255);d[o+1]=clamp(g,0,255);d[o+2]=clamp(b,0,255);d[o+3]=255;
  }
  return img;
}

function overlay(tc,Rw,Rh){
  const {si,mesh,st}=C,lw=Rw/RES,dark=S.ground==='sumi'||st.mat!=='clear'&&st.mat!=='opal';
  const pts=si.lat==='hex'?[[0,0],[Rw/2,Rh/2]]:[[0,0]];
  const r=(si.lat==='rect'?Math.min(Rw,Rh):Rw)*.3;
  tc.lineJoin='round';const cr=Math.cos(C.rot||0),sr=Math.sin(C.rot||0);
  for(const [px,py] of pts)for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const ox=px+i*Rw,oy=py+j*Rh;if(ox<-r||ox>Rw+r||oy<-r||oy>Rh+r)continue;
    for(const f of mesh.plan){
      tc.beginPath();f.pts.forEach((p,k)=>{const x=ox+(p[0]*cr-p[1]*sr)*r,y=oy+(p[0]*sr+p[1]*cr)*r;k?tc.lineTo(x,y):tc.moveTo(x,y);});tc.closePath();
      let col;
      if(st.mat==='opal'){const c=hsv(f.idx*.618+C.phase+(C.phShift||0),.75,1);col=c.map(v=>v*255*(.5+.5*f.shade));}
      else col=st.body.map(v=>v*(.45+.75*f.shade));
      tc.fillStyle=`rgba(${col.map(v=>Math.round(clamp(v,0,255))).join(',')},.42)`;tc.fill();
      tc.strokeStyle=dark?'rgba(255,255,255,.55)':'rgba(20,24,32,.5)';tc.lineWidth=lw;tc.stroke();
    }
  }
}

/* ---------- preview ---------- */
const pv=$('preview'),pc=pv.getContext('2d');
function drawPreview(){
  if(!C.Rw)return;
  const W=pv.clientWidth||800,dpr=Math.min(2,window.devicePixelRatio||1);
  const sc=W/(S.reps*C.Rw),H=Math.round(Math.min(C.Rh*sc*Math.max(1,S.reps*.75),W*1.0));
  pv.width=Math.round(W*dpr);pv.height=Math.round(H*dpr);pv.style.height=H+'px';
  const cv=C.cur||tileCv,kk=sc*C.Rw/cv.width;
  pc.setTransform(dpr*kk,0,0,dpr*kk,0,0);
  pc.fillStyle=pc.createPattern(cv,'repeat');pc.fillRect(0,0,W/kk+1,H/kk+1);
  if(S.seams){
    pc.setTransform(dpr,0,0,dpr,0,0);pc.setLineDash([5,5]);pc.lineWidth=1;
    pc.strokeStyle=S.ground==='sumi'?'rgba(255,255,255,.7)':'rgba(20,24,32,.7)';
    pc.beginPath();for(let x=C.Rw*sc;x<W;x+=C.Rw*sc){pc.moveTo(x,0);pc.lineTo(x,H);}for(let y=C.Rh*sc;y<H;y+=C.Rh*sc){pc.moveTo(0,y);pc.lineTo(W,y);}pc.stroke();pc.setLineDash([]);
  }
}

/* ---------- 3D gem ---------- */
const gc=$('gem'),g=gc.getContext('2d'),tray=$('tray');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let yaw=.5,pitch=-.62,drag=null,last=performance.now();
tray.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};tray.setPointerCapture(e.pointerId);});
tray.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.01;pitch=clamp(drag.pitch+(e.clientY-drag.y)*.01,-1.5,1.5);angleChanged(true);});
const endDrag=()=>{if(!drag)return;drag=null;if(S.link){clearTimeout(fullT);fullT=setTimeout(()=>renderTile(true),120);}};
tray.addEventListener('pointerup',endDrag);tray.addEventListener('pointercancel',endDrag);
tray.addEventListener('keydown',e=>{const k={ArrowLeft:[-.06,0],ArrowRight:[.06,0],ArrowUp:[0,-.05],ArrowDown:[0,.05]}[e.key];if(!k)return;e.preventDefault();yaw+=k[0];pitch=clamp(pitch+k[1],-1.5,1.5);angleChanged(false);});
function sizeGem(){const r=tray.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);gc.width=Math.round(r.width*dpr);gc.height=Math.round(r.height*dpr);}
function drawGem(now){
  const dt=Math.min(50,now-last);last=now;if(!drag&&!reduce&&!S.link)yaw+=dt*.00035;
  if(C.mesh){
    const {V,F,ext}=C.mesh,st=C.st,W=gc.width,H=gc.height,Sc=Math.min(W,H)*.4/ext;
    g.clearRect(0,0,W,H);
    const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
    const P=V.map(v=>{const x1=v[0]*cy+v[2]*sy,z1=-v[0]*sy+v[2]*cy,y2=v[1]*cp-z1*sp,z2=v[1]*sp+z1*cp;return [x1,y2,z2];});
    const L=norm([-.45,.65,.62]),Hv=norm([L[0],L[1],L[2]+1]),body=st.body,clear=st.mat==='clear',dark=S.ground==='sumi';
    const list=F.map((f,i)=>{const a=P[f[0]],b=P[f[1]],c=P[f[2]];
      const n=norm([(b[1]-a[1])*(c[2]-a[2])-(b[2]-a[2])*(c[1]-a[1]),(b[2]-a[2])*(c[0]-a[0])-(b[0]-a[0])*(c[2]-a[2]),(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0])]);
      let z=0;for(const k of f)z+=P[k][2];return {f,n,z:z/f.length,i};}).sort((p,q)=>p.z-q.z);
    const scr=v=>{const k=1/(1-v[2]*.1);return [W/2+v[0]*Sc*k,H/2-v[1]*Sc*k];};
    for(const o of list){
      const n=o.n,front=n[2]>0;if(!clear&&!front)continue;
      g.beginPath();o.f.forEach((k,j)=>{const s=scr(P[k]);j?g.lineTo(s[0],s[1]):g.moveTo(s[0],s[1]);});g.closePath();
      const diff=Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]),spec=Math.pow(Math.max(0,n[0]*Hv[0]+n[1]*Hv[1]+n[2]*Hv[2]),clear?60:28);
      if(clear){
        if(!front){
          const e=.5+.5*Math.sin(n[0]*6+n[1]*4+n[2]*5),br=.16+.84*Math.pow(e,3),fire=Math.min(1,st.disp*16)*Math.pow(e,6),sc=hsv(n[0]*1.3+n[1]*.7+n[2]*.9,.9,1);
          const col=body.map((v,c)=>v*br*1.1*(1-fire*.7)+255*sc[c]*fire*.7);
          g.fillStyle=`rgb(${col.map(v=>Math.round(clamp(v,0,255))).join(',')})`;g.fill();
        }else{
          g.fillStyle=`rgba(${body.join(',')},.2)`;g.fill();
          const rim=Math.pow(1-n[2],3)*.3+spec*.85;if(rim>.01){g.fillStyle=`rgba(255,255,255,${rim.toFixed(3)})`;g.fill();}
          g.strokeStyle='rgba(255,255,255,.38)';g.lineWidth=Math.max(1,W/700);g.stroke();
        }
      }else{
        let col;
        if(st.mat==='opal'){const base=dark?[18,22,36]:[224,226,230],pl=Math.pow(.5+.5*Math.sin(o.i*12.99+n[2]*3+n[0]*2),3)*.85,sc=hsv(o.i*.618+n[0]*.8+n[1]*.5+C.phase,.85,1);
          col=base.map((v,c)=>v*(.45+.55*diff)*(1-pl)+255*sc[c]*pl*(.5+.5*diff)+220*spec*.6);}
        else if(st.mat==='moon'){const ad=Math.pow(Math.max(0,n[2]),4)*.55;col=body.map((v,c)=>v*(.35+.6*diff)+[70,120,255][c]*ad+200*spec*.5);}
        else if(st.mat==='pearl'){const ir=hsv(n[0]*.6+n[1]*.4,.3,1);col=body.map((v,c)=>v*(.42+.58*diff)+255*ir[c]*.08+255*spec*.75);}
        else col=body.map(v=>v*(.32+.68*diff)+255*spec*.35);
        const cs=`rgb(${col.map(v=>Math.round(clamp(v,0,255))).join(',')})`;g.fillStyle=cs;g.fill();g.strokeStyle=cs;g.lineWidth=1;g.stroke();
      }
    }
  }
  requestAnimationFrame(drawGem);
}

/* ---------- wiring ---------- */
bindChips('links','link',()=>{});
$('links').querySelectorAll('.chip').forEach(b=>{const o=b.onclick;b.onclick=()=>{o();S.link=b.dataset.v==='on';updateAngle();renderTile(true);};});
$('resetAng').onclick=()=>{yaw=YAW0;pitch=PITCH0;updateAngle();if(S.link)renderTile(true);};
$('goToday').onclick=()=>{S.m=TODAY_M;S.d=TODAY_D;birthChanged();};
$('prevDay').onclick=()=>shiftDay(-1);$('nextDay').onclick=()=>shiftDay(1);
bindChips('modes','mode',()=>renderTile(false));
bindChips('grounds','ground',()=>renderTile(false));
let st0;
$('strength').oninput=e=>{S.strength=+e.target.value;$('strengthOut').textContent=S.strength.toFixed(2);clearTimeout(st0);st0=setTimeout(()=>renderTile(false),120);};
let rp0;$('reps').oninput=e=>{S.reps=+e.target.value;$('repsOut').textContent=S.reps;drawPreview();clearTimeout(rp0);rp0=setTimeout(updateWallPreview,150);};
bindChips('exports','exp',()=>{updateExpSize();updateWallPreview();});
bindChips('wptext','wptext',updateWallPreview);bindChips('wppos','wppos',updateWallPreview);
$('saveBtn').onclick=savePNG;
(async()=>{
  if(window.claude&&window.claude.use){try{downloads=await window.claude.use('downloads');}catch(e){downloads=null;}}
  else downloads={save:async({filename,data})=>{const u=URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return {status:'saved'};}};
  if(downloads)$('saveBtn').hidden=false;
})();
$('seams').onchange=e=>{S.seams=e.target.checked;drawPreview();};
window.addEventListener('resize',()=>{sizeGem();drawPreview();});
function applyLang(){
  document.documentElement.lang=LANG;document.title=t('doc');
  document.querySelectorAll('[data-i]').forEach(el=>{const v=t(el.dataset.i);if(el.dataset.i==='title')el.innerHTML=v;else el.textContent=v;});
  document.querySelectorAll('[data-a]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.a)));
  document.querySelectorAll('[data-alt]').forEach(el=>el.alt=t(el.dataset.alt));
  $('langs').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===LANG)));
  stoneChips();renderBirth();updateExpSize();
}
$('langs').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{LANG=b.dataset.v;try{localStorage.setItem('lapis-natalis-lang',LANG);}catch(e){}applyLang();setup();});
sizeGem();applyLang();setup();requestAnimationFrame(drawGem);
})();
</script>
